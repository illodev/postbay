# Everything on one machine: PostgreSQL, the app, a worker and Caddy for TLS. Files are kept on the `files` volume and the app serves
# them at the media domain; STORAGE_DRIVER=s3 keeps them in a bucket of your own instead (docs/deploying.md#files-and-the-media-domain).
#
#   cp deploy/.env.example deploy/.env      # then edit it
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env run --rm app \
#     node apps/api/dist/cli.js bootstrap --workspace "Acme" --brand "Acme Spain" --timezone Europe/Madrid --admin you@example.com
# What the web server and the worker both need: they run the same code against the same database and files.
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://estudio:${DB_PASSWORD}@db:5432/estudio
  SECRET: ${SECRET:?set SECRET (32+ random characters)}
  APP_URL: https://${APP_DOMAIN:?set APP_DOMAIN}
  MEDIA_URL: https://${MEDIA_DOMAIN:?set MEDIA_DOMAIN}
  # Empty: local, the files volume below. s3: a bucket of your own, and the S3_* values say which.
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
  # Required while email-link sign-in is on (the default): the app refuses to start without it rather than put sign-in links in its log.
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-Studio <no-reply@localhost>}
  # Connecting accounts and publishing to them (docs/networks.md). Leave the network credentials empty to keep an account manual.
  TOKEN_KEY: ${TOKEN_KEY:-}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  # With Facebook Login for Business: the login configuration the sign-in dialog uses (and the one for brands with prizes).
  META_LOGIN_CONFIG_ID: ${META_LOGIN_CONFIG_ID:-}
  META_LOGIN_CONFIG_ID_PRIZES: ${META_LOGIN_CONFIG_ID_PRIZES:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  # The other networks, results and prizes (docs/networks.md, docs/prizes.md). Each switches on with its credentials; Bluesky needs only TOKEN_KEY.
  THREADS_APP_ID: ${THREADS_APP_ID:-}
  THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}
  TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
  TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
  LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
  LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
  LINKEDIN_VERSION: ${LINKEDIN_VERSION:-202604}
  X_CLIENT_ID: ${X_CLIENT_ID:-}
  X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
  PINTEREST_APP_ID: ${PINTEREST_APP_ID:-}
  PINTEREST_APP_SECRET: ${PINTEREST_APP_SECRET:-}
  META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
  # Webhooks (docs/agents.md) need TOKEN_KEY above to seal their secrets. In production they go to public addresses over https only;
  # set this to true to let them reach private ones (a runner on the same network, for example). Never needed for a public receiver.
  WEBHOOK_ALLOW_PRIVATE_NETWORKS: ${WEBHOOK_ALLOW_PRIVATE_NETWORKS:-}
  # Signing in and notifications (docs/security.md, docs/notifications.md). Single sign-on switches on with the OIDC_* values; a second factor (an authenticator app)
  # is asked of admins and approvers by default in production; Slack needs TOKEN_KEY above, and push messages need nothing.
  SECOND_FACTOR_REQUIRED: ${SECOND_FACTOR_REQUIRED:-}
  # Default: on, except with OIDC_SECOND_FACTOR=idp, where an emailed link would skip the provider's second step.
  EMAIL_LINK_LOGIN: ${EMAIL_LINK_LOGIN:-}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_LABEL: ${OIDC_LABEL:-single sign-on}
  OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
  OIDC_SECOND_FACTOR: ${OIDC_SECOND_FACTOR:-app}
  OIDC_TRUST_EMAIL: ${OIDC_TRUST_EMAIL:-}
  # Ask YouTube for the Analytics permission so watch time can be read (a sensitive scope: the Google project has to be verified for it).
  GOOGLE_ANALYTICS: ${GOOGLE_ANALYTICS:-}
  # How much a brand may have waiting in unfinished big uploads on the staging volume, in GB (20 when empty).
  STAGING_MAX_GB_PER_BRAND: ${STAGING_MAX_GB_PER_BRAND:-}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: estudio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: estudio
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U estudio']
      interval: 5s
      retries: 10

  # The web server. The queue runs in the worker below, so a slow transcode never competes with a page load.
  app:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      <<: *app-env
      PORT: 3000
      RUN_WORKERS: 'false'
    # Big uploads arrive in staging in pieces and are checked before they are stored; on a volume, an upload survives a restart.
    volumes:
      - staging:/var/lib/estudio/staging
      - files:/var/lib/estudio/files

  # Prepares, publishes and checks posts: the queue (pg-boss, in the same PostgreSQL), transcoding with ffmpeg, retries.
  # Safe to run more than once: each publication is leased to one worker at a time.
  worker:
    build:
      context: ..
    restart: unless-stopped
    command: ['node', 'apps/api/dist/worker-main.js']
    depends_on:
      db: { condition: service_healthy }
    environment:
      <<: *app-env
    volumes:
      - files:/var/lib/estudio/files
    healthcheck:
      disable: true

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  db:
  files:
  staging:
  caddy_data:
